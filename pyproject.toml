[project]
name = "nfl-bdb-2027"
version = "0.1.0"
description = "NFL Big Data Bowl 2027 entry"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "kaggle>=1.6",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nflbdb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["nflbdb"]
